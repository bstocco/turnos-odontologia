# Entorno `produccion` (C-20, D6): datos reales solo tras cumplir el checklist legal (D2).
# Uso: fly deploy --config fly.produccion.toml
# Los secretos (DATABASE_URL, DATABASE_MIGRATION_URL, JWT_*, EMAIL_API_KEY, ADMIN_INTERNAL_KEY,
# PUBLIC_BASE_URL, EMAIL_FROM) NO van acá: se cargan con `fly secrets set` (tarea 3.2).
app = 'turnos-produccion'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  ALLOW_SEED = 'false'

[processes]
  api = 'node dist/main.js'
  worker = 'node dist/infrastructure/queue/worker-cli.js'

[deploy]
  # Migraciones con el rol `migra` ANTES de reemplazar la versión (D4). Si fallan, el
  # despliegue se cancela y la versión anterior sigue activa.
  release_command = 'node dist/infrastructure/db/migrate-cli.js'
  strategy = 'rolling'

# Solo el proceso `api` expone HTTP; el worker no tiene servicio.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['api']

  [[http_service.checks]]
    method = 'GET'
    path = '/salud'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['api', 'worker']
